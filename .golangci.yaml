version: "2"
run:
  timeout: 60s

linters:
  default: all
  enable:
    - gomodguard_v2
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosmopolitan
  disable:

    # too annoying
    - wsl_v5
    - cyclop
    - exhaustive
    - exhaustruct
    - exhaustruct_v5
    - forbidigo
    - funlen
    - gochecknoglobals
    - godot
    - lll
    - nakedret
    - nestif
    - nlreturn
    - tagliatelle
    - varnamelen
    - wsl
    - nonamedreturns

    #complexity linters
    - gocognit
    - gocyclo
    - maintidx

    # i disagree with these
    - gomodguard
    - noinlineerr
    - wrapcheck
    - nolintlint
    - errorlint
    - noctx
    - gochecknoinits

    # these might be usefull for suggestions but should not block the build
    - prealloc
    - godox
    - dupl
    - goconst
    - nilerr
    - ireturn
    - nosprintfhostport
    - depguard
    - tagalign
    - protogetter
    - mnd
    - err113
    - misspell
    - revive

    # buggy?
    - musttag
    - intrange

    # disabled because of generics
    - rowserrcheck
    - sqlclosecheck
    - wastedassign